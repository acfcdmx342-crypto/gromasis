<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Agenda de Actividades</title>
  
  <!-- FullCalendar CSS & JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/es.global.min.js"></script>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body { 
      padding: 10px; 
      transition: background-color 0.3s, color 0.3s;
    }
    
    .calendar-container {
      width: 100%;
      max-width: 720px; 
      margin: 0 auto;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    [data-bs-theme="dark"] .calendar-container {
      background-color: #2b3035;
      border: 1px solid #495057;
    }
    [data-bs-theme="light"] .calendar-container {
      background-color: #ffffff;
    }

    /* Reglas específicas para pantallas pequeñas (Celulares) */
    @media (max-width: 576px) {
      body { padding: 5px; }
      .calendar-container { padding: 8px; border-radius: 8px; }
      
      /* Reducción de textos en la cabecera */
      .fc .fc-toolbar-title { font-size: 0.95rem !important; }
      .fc .fc-button { padding: 0.2rem 0.4rem !important; font-size: 0.75rem !important; }
      
      /* Días de la semana abreviados y compactos */
      .fc-col-header-cell-cushion { font-size: 0.75rem; padding: 2px !important; }
      .fc-daygrid-day-number { font-size: 0.75rem; padding: 2px !important; }

      /* Celdas del calendario compactas */
      .fc-daygrid-day-frame { min-height: 45px !important; }
      
      /* Eventos compactos en móviles */
      .fc-event {
        margin: 1px 0 !important;
        padding: 1px 2px !important;
        border-radius: 3px !important;
      }
      .fc-event-title {
        font-size: 0.7rem !important;
        line-height: 1.1;
      }
    }

    /* Estilos generales para el título del evento */
    .fc-event-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .fc-event-time { display: none; }
  </style>
</head>
<body>

<div class="container-fluid p-0 my-2">
  <div class="d-flex justify-content-between align-items-center mb-2 mx-auto px-1" style="max-width: 720px;">
    <h4 class="m-0 fs-5 fw-bold">Mis Actividades</h4>
    <div class="d-flex gap-1">
      <button class="btn btn-outline-warning btn-sm px-2" id="btnThemeToggle">☀️ Día</button>
      <button class="btn btn-primary btn-sm px-2" data-bs-toggle="modal" data-bs-target="#modalNuevaTarea">+ Nueva</button>
    </div>
  </div>

  <div class="calendar-container">
    <div id="calendar"></div>
  </div>
</div>

<!-- Modal Registrar Nueva Tarea -->
<div class="modal fade" id="modalNuevaTarea" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fs-6">Registrar Actividad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formNuevaTarea">
        <div class="modal-body">
          <div class="mb-2">
            <label for="tareaTitulo" class="form-label small">Título de la actividad</label>
            <input type="text" class="form-control form-control-sm" id="tareaTitulo" required placeholder="Ej. Sucursal YGriega">
          </div>
          <div class="mb-2">
            <label for="tareaFecha" class="form-label small">Fecha y Hora de inicio</label>
            <input type="datetime-local" class="form-control form-control-sm" id="tareaFecha" required>
          </div>
          <div class="mb-2">
            <label for="tareaDescripcion" class="form-label small">Descripción / Detalles</label>
            <textarea class="form-control form-control-sm" id="tareaDescripcion" rows="3" placeholder="Detalle de lo que se va a realizar..."></textarea>
          </div>
        </div>
        <div class="modal-footer p-2">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Detalle Tarea -->
<div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fs-6" id="detalleTitulo">Detalle de la Actividad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2 small"><strong>Estado:</strong> <span id="detalleEstatus" class="badge"></span></p>
        <p class="mb-2 small"><strong>Fecha y Hora:</strong> <span id="detalleFecha"></span></p>
        <p class="mb-1 small"><strong>Descripción / Detalles:</strong></p>
        <div id="detalleDescripcion" class="p-2 border rounded bg-body-tertiary small mb-3"></div>
        
        <!-- Campo para Folio obligatorio de Cierre -->
        <div id="seccionFolio" class="mb-2">
          <label for="inputFolio" class="form-label text-warning fw-bold small">Folio de Cierre <span class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-sm" id="inputFolio" placeholder="Ingrese el folio obligatoriamente">
          <div class="invalid-feedback small">El folio es requerido para cerrar la actividad.</div>
        </div>

        <!-- Muestra del Folio cuando la tarea ya está concluida -->
        <div id="seccionFolioGuardado" class="d-none mb-2">
          <p class="mb-0 small"><strong>Folio de Cierre:</strong> <span id="textFolioGuardado" class="badge bg-secondary fs-6"></span></p>
        </div>

        <input type="hidden" id="detalleTareaId">
      </div>
      <div class="modal-footer p-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-success btn-sm" id="btnCompletar">Marcar como Concluida</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  const modalDetalle = new bootstrap.Modal(document.getElementById('modalDetalle'));
  const modalNueva = new bootstrap.Modal(document.getElementById('modalNuevaTarea'));

  function obtenerActividadesGuardadas() {
    const tareas = localStorage.getItem('mis_actividades');
    return tareas ? JSON.parse(tareas) : [];
  }

  function guardarActividadEnStorage(nuevaActividad) {
    const tareas = obtenerActividadesGuardadas();
    tareas.push(nuevaActividad);
    localStorage.setItem('mis_actividades', JSON.stringify(tareas));
  }

  function actualizarEstatusStorage(id, estatus, folio) {
    let tareas = obtenerActividadesGuardadas();
    tareas = tareas.map(t => {
      if (t.id === id) {
        t.extendedProps.estatus = estatus;
        t.extendedProps.folio = folio;
        t.backgroundColor = estatus === 'concluida' ? '#198754' : '#0d6efd';
      }
      return t;
    });
    localStorage.setItem('mis_actividades', JSON.stringify(tareas));
  }

  // Detectar si el dispositivo es móvil para ajustar botones y vista inicial
  const esMovil = window.innerWidth <= 576;

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'es',
    buttonText: { today: 'Hoy', month: 'Mes', week: 'Sem' },
    headerToolbar: {
      left: esMovil ? 'prev,next' : 'prev,next today',
      center: 'title',
      right: esMovil ? 'today' : 'dayGridMonth,timeGridWeek'
    },
    height: 'auto',
    contentHeight: 'auto',
    handleWindowResize: true,
    events: obtenerActividadesGuardadas(),

    eventClick: function(info) {
      const evento = info.event;
      const props = evento.extendedProps;

      document.getElementById('detalleTareaId').value = evento.id;
      document.getElementById('detalleTitulo').innerText = evento.title;
      document.getElementById('detalleDescripcion').innerText = props.descripcion || 'Sin descripción guardada.';
      document.getElementById('detalleFecha').innerText = evento.start ? evento.start.toLocaleString('es-MX') : '';
      
      const badgeEstatus = document.getElementById('detalleEstatus');
      const btnCompletar = document.getElementById('btnCompletar');
      const seccionFolio = document.getElementById('seccionFolio');
      const seccionFolioGuardado = document.getElementById('seccionFolioGuardado');
      const inputFolio = document.getElementById('inputFolio');

      inputFolio.value = '';
      inputFolio.classList.remove('is-invalid');

      if (props.estatus === 'concluida') {
        badgeEstatus.className = 'badge bg-success';
        badgeEstatus.innerText = 'Concluida';
        btnCompletar.style.display = 'none';
        seccionFolio.classList.add('d-none');
        seccionFolioGuardado.classList.remove('d-none');
        document.getElementById('textFolioGuardado').innerText = props.folio || 'N/A';
      } else {
        badgeEstatus.className = 'badge bg-warning text-dark';
        badgeEstatus.innerText = 'Pendiente';
        btnCompletar.style.display = 'block';
        seccionFolio.classList.remove('d-none');
        seccionFolioGuardado.classList.add('d-none');
      }

      modalDetalle.show();
    }
  });

  calendar.render();

  // Guardar nueva actividad
  document.getElementById('formNuevaTarea').addEventListener('submit', function(e) {
    e.preventDefault();
    const idUnico = 'task_' + Date.now();
    const titulo = document.getElementById('tareaTitulo').value;
    const fecha = document.getElementById('tareaFecha').value;
    const descripcion = document.getElementById('tareaDescripcion').value;

    const nuevaTarea = {
      id: idUnico,
      title: titulo,
      start: fecha,
      backgroundColor: '#0d6efd',
      borderColor: '#0d6efd',
      extendedProps: {
        descripcion: descripcion,
        estatus: 'pendiente',
        folio: ''
      }
    };

    calendar.addEvent(nuevaTarea);
    guardarActividadEnStorage(nuevaTarea);

    document.getElementById('formNuevaTarea').reset();
    modalNueva.hide();
  });

  // Marcar como Concluida con validación
  document.getElementById('btnCompletar').addEventListener('click', function() {
    const tareaId = document.getElementById('detalleTareaId').value;
    const inputFolio = document.getElementById('inputFolio');
    const folioTexto = inputFolio.value.trim();

    if (folioTexto === '') {
      inputFolio.classList.add('is-invalid');
      inputFolio.focus();
      return;
    }

    inputFolio.classList.remove('is-invalid');
    const evento = calendar.getEventById(tareaId);

    if (evento) {
      evento.setExtendedProp('estatus', 'concluida');
      evento.setExtendedProp('folio', folioTexto);
      evento.setProp('backgroundColor', '#198754');
      evento.setProp('borderColor', '#198754');

      actualizarEstatusStorage(tareaId, 'concluida', folioTexto);
      modalDetalle.hide();
    }
  });

  // Conmutador Día / Noche
  const btnTheme = document.getElementById('btnThemeToggle');
  btnTheme.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    document.documentElement.setAttribute('data-bs-theme', newTheme);
    btnTheme.innerText = newTheme === 'dark' ? '☀️ Día' : '🌙 Noche';
    btnTheme.className = newTheme === 'dark' ? 'btn btn-outline-warning btn-sm px-2' : 'btn btn-outline-secondary btn-sm px-2';
  });
});
</script>
</body>
</html>
