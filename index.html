<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
        }

        .login-card h2 {
            margin-bottom: 0.5rem;
            color: #38bdf8;
            font-size: 1.8rem;
        }

        .login-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            background-color: #0284c7;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .btn-recuperar {
            margin-top: 15px;
            background: transparent;
            border: none;
            color: #38bdf8;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }

        .btn-recuperar:hover {
            color: #7dd3fc;
        }

        #message {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Bienvenido</h2>
        <p>Ingresa tus credenciales para acceder</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="user">USUARIO</label>
                <input type="text" id="user" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="pass">CONTRASEÑA</label>
                <input type="password" id="pass" required>
            </div>

            <button type="submit" class="btn-submit" id="btnEntrar">ENTRAR</button>
        </form>

        <button type="button" class="btn-recuperar" id="btnRecuperar">¿Olvidaste tu contraseña?</button>

        <div id="message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        // Base de datos actualizada
        const firebaseConfig = { databaseURL: "https://gromasis-9c094-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        emailjs.init("rCrANJZmFHHsk9Yo0");

        async function enviarCodigoCorreo(correo, nombre, codigo) {
            try {
                await emailjs.send(
                    "service_2om03jm",
                    "template_8e32lm9",
                    {
                        nombre: nombre,
                        codigo: codigo,
                        email: correo
                    }
                );
                return true;
            } catch(error) {
                console.error(error);
                return false;
            }
        }

        let codigoRecuperacion = null;
        let usuarioKey = null;

        function validarPassword(password) {
            return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&._\-])[A-Za-z\d@$!%*?&._\-]{8,}$/.test(password);
        }

        // EVENTO DE LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            const btn = document.getElementById('btnEntrar');
            
            const userIn = document.getElementById('user').value.trim().toUpperCase();
            const passIn = document.getElementById('pass').value.trim();

            btn.disabled = true;
            btn.innerText = "VERIFICANDO...";

            try {
                // Consulta al nodo 'usuarios' en la nueva base de datos
                const snapshot = await get(child(ref(db), 'usuarios'));
                if (snapshot.exists()) {
                    const usuariosData = snapshot.val();
                    
                    let encontrado = Object.values(usuariosData).find(p => {
                        const passGuardada = p.password || p.contraseña;
                        return p.usuario?.toUpperCase() === userIn && passGuardada === passIn;
                    });

                    if (encontrado) {
                        if (encontrado.statusActual === 'BAJA') {
                            msg.style.color = "#ef4444";
                            msg.innerText = "Usuario dado de baja. Acceso denegado.";
                        } else {
                            localStorage.setItem('user_name', encontrado.nombreCompleto || encontrado.usuario);
                            msg.style.color = "#22c55e";
                            msg.innerText = "¡Acceso correcto!";
                            setTimeout(() => window.location.href = "ab.html", 800);
                        }
                    } else {
                        msg.style.color = "#ef4444";
                        msg.innerText = "Usuario o contraseña incorrectos";
                    }
                } else {
                    msg.style.color = "#ef4444";
                    msg.innerText = "No se encontraron registros de usuarios";
                }
            } catch (err) {
                console.error(err);
                msg.innerText = "Error de conexión";
            } finally {
                btn.disabled = false;
                btn.innerText = "ENTRAR";
            }
        });

        // EVENTO RECUPERAR CONTRASEÑA
        document.getElementById('btnRecuperar').addEventListener('click', async () => {
            const userIn = document.getElementById('user').value.trim().toUpperCase();

            if (!userIn) {
                Swal.fire("Atención", "Escribe primero tu usuario para recuperar la contraseña", "warning");
                return;
            }

            try {
                const snapshot = await get(child(ref(db), 'usuarios'));

                if (!snapshot.exists()) {
                    Swal.fire("Error", "No hay usuarios registrados", "error");
                    return;
                }

                const usuariosData = snapshot.val();
                let encontrado = null;
                
                Object.entries(usuariosData).forEach(([key, value]) => {
                    if (value.usuario?.toUpperCase() === userIn) {
                        encontrado = value;
                        usuarioKey = key;
                    }
                });

                if (!encontrado) {
                    Swal.fire("No encontrado", "El usuario no existe en el catálogo", "error");
                    return;
                }

                const nombre = encontrado.nombreCompleto || "Usuario";
                const correo = encontrado.correo || 
                               encontrado.accesosGrupoRoma?.correos?.INSTITUCIONAL || 
                               encontrado.accesosGrupoRoma?.correos?.GMAIL || "";

                codigoRecuperacion = Math.floor(100000 + Math.random() * 900000).toString();

                const opcion = await Swal.fire({
                    title: "Recuperar contraseña",
                    text: `Usuario encontrado: ${nombre}`,
                    icon: "info",
                    showCancelButton: true,
                    confirmButtonText: "Enviar código",
                    cancelButtonText: "Cancelar"
                });

                if (opcion.isConfirmed) {
                    if (!correo) {
                        Swal.fire("Sin correo", "Este usuario no tiene un correo electrónico registrado", "warning");
                        return;
                    }

                    Swal.fire({
                        title: "Enviando código...",
                        allowOutsideClick: false,
                        didOpen: () => Swal.showLoading()
                    });

                    const enviado = await enviarCodigoCorreo(correo, nombre, codigoRecuperacion);
                    Swal.close();

                    if (!enviado) {
                        Swal.fire("Error", "No fue posible enviar el correo", "error");
                        return;
                    }

                    await Swal.fire("Código enviado", `Se envió un código a ${correo}`, "success");

                    const { value: codigoIngresado } = await Swal.fire({
                        title: "Validación",
                        input: "text",
                        inputLabel: "Ingresa el código recibido",
                        inputPlaceholder: "Código de 6 dígitos",
                        confirmButtonText: "Validar"
                    });

                    if (codigoIngresado !== codigoRecuperacion) {
                        Swal.fire("Error", "Código incorrecto", "error");
                        return;
                    }

                    const { value: nuevaPassword } = await Swal.fire({
                        title: "Nueva contraseña",
                        input: "password",
                        inputLabel: "Ingresa la nueva contraseña"
                    });

                    if (!validarPassword(nuevaPassword)) {
                        Swal.fire(
                            "Contraseña inválida",
                            "Debe contener:\n\n• 8 caracteres mínimo\n• 1 mayúscula\n• 1 minúscula\n• 1 número\n• 1 carácter especial",
                            "warning"
                        );
                        return;
                    }

                    const { value: confirmarPassword } = await Swal.fire({
                        title: "Confirmar contraseña",
                        input: "password",
                        inputLabel: "Repite la contraseña"
                    });

                    if (nuevaPassword !== confirmarPassword) {
                        Swal.fire("Error", "Las contraseñas no coinciden", "error");
                        return;
                    }

                    await update(ref(db, `usuarios/${usuarioKey}`), {
                        password: nuevaPassword,
                        contraseña: nuevaPassword
                    });

                    Swal.fire("Correcto", "Contraseña actualizada correctamente", "success");
                }
            } catch (error) {
                console.error(error);
                Swal.fire("Error", "No se pudo recuperar la contraseña", "error");
            }
        });    
          
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };
    </script>
</body>
</html>
